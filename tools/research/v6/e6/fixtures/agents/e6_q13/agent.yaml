name: e6_q13
display: E6 family package e6_q13
description: Research-only V6 E6 matched-family package (implementation plan Sec 5). Not a product starter agent.
kind: python
api_version: 2
entrypoint: agent.py:create_agent
version: "1.0.0"
parameters:
  search:
    type: choice
    choices: [none, fast, paced, read]
    default: none
  posture:
    type: choice
    choices: [attack, guard, paint]
    default: paint
  evade:
    type: boolean
    default: false
  processes:
    type: integer
    minimum: 1
    maximum: 2
    default: 1
  adaptive:
    type: boolean
    default: true
