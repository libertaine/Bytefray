name: Issue 7 differential (temporary experiment)

# Bounded A/B for issue #7 after PR #12. Temporary: lives only on the
# experiment/issue7-gui-ab branch and is never merged. Each job checks out
# an unmodified tree by SHA and runs a fixed number of repetitions.
#   base   = 8922882 (development before PR #12)
#   merged = 3e597fa (PR #12 merge commit)
# Exit classes: 0 pass, 139 crash (SIGSEGV), 124/137 hang (timeout), other fail.

on:
  push:
    branches: [experiment/issue7-gui-ab]

permissions:
  contents: read

env:
  BASE_SHA: 8922882966f70af01d450635ba1ff6c782d27016
  MERGED_SHA: 3e597fa3c877ffd1f12be15afdde488434d8317d
  AFFECTED: tests/test_v5_replay_history_qualification.py::test_repeated_concurrent_close_reopen_preserves_ownership
  NEW_TI: tests/test_agent_development_trace.py::test_trace_inspector_dialog_reads_schema_2_traces_with_process_identity

jobs:
  differential:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        cell: [iso-base, iso-merged, full-base, full-merged, full-merged-noTI]
        shard: [1, 2, 3, 4, 5]
    env:
      QT_OPENGL: software
      QT_QPA_PLATFORM: xcb
      LIBGL_ALWAYS_SOFTWARE: "1"
      PYTHONFAULTHANDLER: "1"
      CELL: ${{ matrix.cell }}
      SHARD: ${{ matrix.shard }}
    steps:
      - name: Select commit
        run: |
          case "$CELL" in
            *-base) echo "SHA=$BASE_SHA" >> "$GITHUB_ENV" ;;
            *) echo "SHA=$MERGED_SHA" >> "$GITHUB_ENV" ;;
          esac

      - uses: actions/checkout@v6
        with:
          ref: ${{ env.SHA }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13.18"

      - name: Install Qt X11 runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libegl1 libgl1 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 \
            libxcb-xinerama0 libxcb-xkb1

      - name: Install Designer dependencies (qualified binding, as CI)
        run: |
          python -m pip install 'pip==26.2.1'
          python -m pip install -e '.[designer,dev]' -c tools/product-ci-constraints.txt --build-constraint tools/product-ci-constraints.txt
          python -m pip freeze > freeze.txt
          grep -iE '^(pyside6|shiboken6|pytest)' freeze.txt
          python -VV
          git rev-parse HEAD

      - name: Repetitions
        # Plain bash: GitHub's default "bash -e -o pipefail" stopped run
        # 43329267401 after the first repetition of every job.
        shell: bash --noprofile --norc {0}
        run: |
          set -u
          case "$CELL" in
            iso-*) REPS=10; SEL=("$AFFECTED") ;;
            full-merged-noTI) REPS=2; SEL=(tests/ --deselect "$NEW_TI") ;;
            full-*) REPS=2; SEL=(tests/) ;;
          esac
          mkdir -p out
          printf 'cell\tshard\trep\tsha\texit\tclass\tseconds\tpassed_cases\tcrash_test\n' > out/results.tsv
          for rep in $(seq 1 "$REPS"); do
            log="out/${CELL}-s${SHARD}-r${rep}.log"
            start=$(date +%s)
            timeout -k 30 900 xvfb-run -a python -X faulthandler -m pytest -v \
              --capture=tee-sys -o faulthandler_timeout=300 -ra -m gui \
              "${SEL[@]}" --junitxml="out/${CELL}-s${SHARD}-r${rep}.xml" > "$log" 2>&1
            code=$?
            secs=$(( $(date +%s) - start ))
            case "$code" in
              0) cls=pass ;; 139) cls=crash ;; 124|137) cls=hang ;; *) cls=fail ;;
            esac
            passed=$(grep -cE ' PASSED' "$log" || true)
            crash=$(grep -A60 -E 'Fatal Python error|Timeout \(0' "$log" | grep -oE 'in test_[A-Za-z0-9_]+' | head -1 | sed 's/^in //')
            printf '%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\n' "$CELL" "$SHARD" "$rep" "${SHA:0:7}" "$code" "$cls" "$secs" "$passed" "${crash:--}" >> out/results.tsv
            tail -n 1 out/results.tsv
          done
          cat out/results.tsv >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: ab-${{ matrix.cell }}-s${{ matrix.shard }}
          path: |
            out/
            freeze.txt
