name: CI

on:
  pull_request:
  push:
    branches: [main, 'development/**']
  schedule:
    - cron: '41 5 * * 1'
  workflow_dispatch:
    inputs:
      full:
        description: Full supported matrix (weekly-equivalent qualification)
        type: boolean
        default: false
  workflow_call:
    inputs:
      full:
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name != 'pull_request' && github.run_id || 'pr' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - id: matrix
        env:
          FULL: ${{ github.event_name == 'schedule' || inputs.full }}
          PUSH: ${{ github.event_name == 'push' }}
        run: |
          python - <<'PY'
          import json, os
          full = os.environ['FULL'] == 'true'
          entries = [dict(python='3.13', profile='primary', reduced=False, advisory=False),
                     dict(python='3.11', profile='user', reduced=not full, advisory=False)]
          if full or os.environ['PUSH'] == 'true':
              entries += [dict(python='3.12', profile='user', reduced=not full, advisory=False),
                          dict(python='3.14', profile='user', reduced=False, advisory=False)]
          if os.environ.get('GITHUB_EVENT_NAME') == 'schedule':
              entries += [dict(python='3.15', profile='forward', reduced=False, advisory=True),
                          dict(python='3.13', profile='latest', reduced=False, advisory=True)]
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              print('matrix=' + json.dumps(dict(include=entries)), file=out)
          print(json.dumps(entries, indent=2))
          PY

  test-linux-core:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: ${{ matrix.advisory }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install qualified primary environment
        if: matrix.profile == 'primary'
        run: |
          python -m pip install 'pip==26.2.1'
          python -m pip install -e '.[dev,replay]' -c tools/product-ci-constraints.txt --build-constraint tools/product-ci-constraints.txt
      - name: Install normally resolved user or advisory dependencies
        id: dependencies
        if: matrix.profile != 'primary'
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade -e '.[dev,replay]'
      - run: python -m pip freeze
      - name: Full or exact reduced product qualification
        env:
          REDUCED: ${{ matrix.reduced }}
        run: |
          args=()
          if [ "$REDUCED" = true ]; then args+=(--reduced); fi
          python tools/ci_product.py "${args[@]}" -ra --junitxml=product.xml
      - name: Latest dependency Ruff drift
        if: ${{ !cancelled() && matrix.profile == 'latest' && steps.dependencies.outcome == 'success' }}
        run: python -m ruff check .
      - name: Latest dependency engine mypy drift
        if: ${{ !cancelled() && matrix.profile == 'latest' && steps.dependencies.outcome == 'success' }}
        run: python -m mypy engine/src/battle_engine
      - name: Latest dependency client mypy drift
        if: ${{ !cancelled() && matrix.profile == 'latest' && steps.dependencies.outcome == 'success' }}
        run: python -m mypy client/src/battle_client
      - name: Latest dependency helper mypy drift
        if: ${{ !cancelled() && matrix.profile == 'latest' && steps.dependencies.outcome == 'success' }}
        run: python -m mypy --explicit-package-bases tools/qualification/run_determinism_and_neg_cases.py
      - name: Advisory outcome (visible even when installation fails)
        if: always() && matrix.advisory
        run: |
          echo '::warning::Advisory ${{ matrix.profile }} Python ${{ matrix.python }} result: ${{ job.status }}. Inspect failed steps and JUnit; this is not a supported-version qualification.'
          echo 'Advisory ${{ matrix.profile }} Python ${{ matrix.python }}: ${{ job.status }}' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: product-${{ matrix.python }}-${{ matrix.profile }}
          path: product.xml

  quality-package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install qualified quality and build environment
        run: |
          python -m pip install 'pip==26.2.1'
          python -m pip install -e '.[dev,replay]' build -c tools/product-ci-constraints.txt --build-constraint tools/product-ci-constraints.txt
      - run: python -m ruff check .
      - run: python -m mypy engine/src/battle_engine
      - run: python -m mypy client/src/battle_client
      - name: Type-check qualification helpers
        run: python -m mypy --explicit-package-bases tools/qualification/run_determinism_and_neg_cases.py
      - name: Confirm pure launcher import isolation
        run: >-
          python -c "import sys; import battle_engine.launchers,
          app.services.engine_commands; forbidden = [name for name in sys.modules
          if name == 'PySide6' or name.startswith('PySide6.') or name == 'pygame'
          or name.startswith('pygame.')]; assert not forbidden, forbidden"
      - name: Verify current compatibility record and protected evidence
        run: |
          python tools/release_compatibility.py docs/releases/BYTEFRAY_DEVELOPMENT_COMPATIBILITY.json --check
          python tools/qualification/frozen_science.py guard
      - name: Build wheel and source distribution with qualified backend
        env:
          PIP_CONSTRAINT: ${{ github.workspace }}/tools/product-ci-constraints.txt
          PIP_BUILD_CONSTRAINT: ${{ github.workspace }}/tools/product-ci-constraints.txt
        run: python -m build
      - name: Inspect wheel and sdist; build and inspect wheel from sdist
        env:
          PIP_CONSTRAINT: ${{ github.workspace }}/tools/product-ci-constraints.txt
          PIP_BUILD_CONSTRAINT: ${{ github.workspace }}/tools/product-ci-constraints.txt
        run: |
          python tools/check_wheel.py dist/bytefray-*.whl
          python tools/check_sdist.py dist/bytefray-*.tar.gz
      - name: Install wheel into clean environment and smoke outside checkout
        run: |
          python -m venv "$RUNNER_TEMP/wheel-smoke"
          "$RUNNER_TEMP/wheel-smoke/bin/python" -m pip install dist/bytefray-*.whl -c tools/product-ci-constraints.txt
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/wheel-smoke/bin/python" -I -c "import battle_engine, battle_client, app; from importlib.metadata import metadata; assert metadata('bytefray')['Requires-Python'] == '>=3.11'"
          "$RUNNER_TEMP/wheel-smoke/bin/bytefray" --version
      - uses: actions/upload-artifact@v6
        with:
          name: python-packages
          path: dist/*

  build-windows-exe:
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ${{ fromJSON((github.event_name == 'schedule' || inputs.full) && '["3.11", "3.13"]' || '["3.13"]') }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install qualified Windows dependencies
        run: |
          python -m pip install 'pip==26.2.1'
          python -m pip install -e '.[replay,designer,dev,windows-build]' -c tools/windows-build-constraints.txt --build-constraint tools/windows-build-constraints.txt
      - name: Windows process containment and worker cleanup
        run: >-
          python -m pytest
          engine/tests/test_process_containment.py
          engine/tests/test_agent_worker.py
          engine/tests/test_agent_validation.py
          engine/tests/test_agent_test.py
          engine/tests/test_process_runtime_integration.py
          engine/tests/test_v6_alpha_m1_policy_capabilities.py -ra --junitxml=windows-process.xml
      - name: Windows NTFS junction containment
        run: >-
          python -m pytest engine/tests/test_agent_revisions.py
          engine/tests/test_agent_evaluation_revision_capture.py -ra --junitxml=windows-junction.xml
      - name: Build EXEs and verify third-party notices with canonical release script
        if: matrix.python == '3.13'
        shell: pwsh
        run: pwsh tools/build_win.ps1 -Constraints tools/windows-build-constraints.txt
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: windows-${{ matrix.python }}
          path: |
            dist/windows/**
            windows-*.xml
