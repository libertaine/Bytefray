name: Linux GUI smoke
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      full:
        type: boolean
        default: false
  pull_request:
  push:
    branches: [main, 'development/**']
  schedule:
    - cron: '41 5 * * 1'
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-gui-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name != 'pull_request' && github.run_id || 'pr' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pygame-x11-smoke:
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.python-version == '3.15' }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJSON(inputs.full && '["3.11", "3.14"]' || (github.event_name == 'schedule' && '["3.13", "3.14", "3.15"]' || '["3.13"]')) }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: { python-version: "${{ matrix.python-version }}" }
      - run: sudo apt-get update
      - name: Install virtual X server
        run: sudo apt-get install --no-install-recommends xvfb
      - run: python -m pip install -U pip
      - name: Install replay and test dependencies
        env:
          FORWARD: ${{ matrix.python-version == '3.15' }}
        run: |
          if [ "$FORWARD" = true ]; then
            python -m pip install --upgrade -e '.[replay,dev]'
          else
            python -m pip install -e '.[replay,dev]' -c tools/product-ci-constraints.txt --build-constraint tools/product-ci-constraints.txt
          fi
      - name: Exercise one display-backed replay frame and deterministic quit
        run: xvfb-run -a python -m pytest -ra -m gui client/tests/test_linux_pygame_smoke.py --junitxml=pygame.xml

      - name: Forward Python GUI advisory outcome
        if: always() && matrix.python-version == '3.15'
        run: |
          echo '::warning::Python 3.15 Pygame advisory result: ${{ job.status }}'
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: pygame-${{ matrix.python-version }}
          path: pygame.xml

  designer-x11-smoke:
    runs-on: ubuntu-latest
    # Known baseline limitation, not fixed: an intermittent native crash or
    # hang in Replay History worker-thread teardown, issue #7. A hang now
    # fails within the hour, with every thread's stack, rather than holding
    # the runner for the 6-hour default.
    timeout-minutes: 60

    continue-on-error: ${{ matrix.binding == 'latest' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.full && '[{"python":"3.11","binding":"qualified"},{"python":"3.13","binding":"qualified"},{"python":"3.14","binding":"qualified"}]' || (github.event_name == 'schedule' && '[{"python":"3.11","binding":"qualified"},{"python":"3.13","binding":"qualified"},{"python":"3.13","binding":"latest"}]' || '[{"python":"3.13","binding":"qualified"}]')) }}
    env:
      QT_OPENGL: software
      QT_DEBUG_PLUGINS: "1"
      QT_QPA_PLATFORM: xcb
      LIBGL_ALWAYS_SOFTWARE: "1"
      PYTHONFAULTHANDLER: "1"

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - name: Install Qt X11 runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            xvfb \
            libegl1 \
            libgl1 \
            libxkbcommon-x11-0 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xinerama0 \
            libxcb-xkb1

      - name: Install Designer dependencies
        # Qt/PySide 6.12.0 processEvents() decrements None's reference count
        # on CPython 3.10 and aborts even without Designer code. Keep the
        # complete X11 suite on the verified binding pending an upstream fix.
        # See docs/releases/CLASSIC_RULESET_RETIREMENT_CI_REMEDIATION.md.
        env:
          BINDING: ${{ matrix.binding }}
        run: |
          if [ "$BINDING" = qualified ]; then
            python -m pip install 'pip==26.2.1'
            python -m pip install -e '.[designer,dev]' -c tools/product-ci-constraints.txt --build-constraint tools/product-ci-constraints.txt
          else
            python -m pip install --upgrade pip
            python -m pip install --upgrade -e '.[designer,dev]'
          fi
          python -m pip freeze

      - name: Inspect Qt XCB dependencies
        run: |
          plugin="$(python - <<'PY'
          from pathlib import Path
          import PySide6
          print(Path(PySide6.__file__).resolve().parent / "Qt/plugins/platforms/libqxcb.so")
          PY
          )"
          echo "$plugin"
          ldd "$plugin" || true

      - name: Exercise X11 startup, primary window creation, deterministic shutdown,
          and the Agent Development (create/validate/test) workflow
        shell: bash
        run: >-
          xvfb-run -a python -X faulthandler -m pytest -v --capture=tee-sys
          -o faulthandler_timeout=300 -ra -m gui tests/ --junitxml=designer.xml 2>&1 | tee designer.log
      - name: Advisory Designer outcome
        if: always() && matrix.binding == 'latest'
        run: |
          echo '::warning::Unpinned Designer advisory result: ${{ job.status }}; issue #7 remains open.'
          echo 'Unpinned Designer: ${{ job.status }}' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: designer-${{ matrix.python }}-${{ matrix.binding }}
          path: |
            designer.xml
            designer.log
